<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 795" role="img" aria-labelledby="title desc">
<title id="title">Security boundaries and shared responsibility</title><desc id="desc">User authentication controls sessions. The container limits processes and mounts but shares the host kernel. The VM controls volumes, swap and administrative access. The network restricts ingress and egress. Storage has independent permissions, replication and retention. Client encryption does not protect plaintext from a compromised runtime.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#174c4f"/></marker></defs>
<rect width="640" height="795" rx="16" fill="#f7f4eb"/>
<style>text{font-family:'Open Sans',Arial,sans-serif;fill:#153e43}.heading{font-size:24px;font-weight:700}.label{font-size:20px}.small{font-size:18px}.box{fill:#fff;stroke:#174c4f;stroke-width:2}.flow{fill:none;stroke:#174c4f;stroke-width:3;marker-end:url(#arrow)}</style>
<rect x="35" y="25" width="570" height="125" rx="10" fill="#fff" stroke="#174c4f" stroke-width="2"/><text x="53" y="59" class="heading">User · identity and authorization</text><text x="53" y="90" class="label">MFA, named accounts, approvals, least privilege</text><text x="53" y="117" class="label">A notebook login does not exclude administrators.</text><rect x="35" y="175" width="570" height="125" rx="10" fill="#fff" stroke="#174c4f" stroke-width="2"/><text x="53" y="209" class="heading">Container · process restrictions</text><text x="53" y="240" class="label">Non-root, restricted mounts, dropped capabilities</text><text x="53" y="267" class="label">Shared kernel; no privileged mode or Docker socket.</text><rect x="35" y="325" width="570" height="125" rx="10" fill="#f5e1cf" stroke="#174c4f" stroke-width="2"/><text x="53" y="359" class="heading">VM · plaintext boundary</text><text x="53" y="390" class="label">Encrypted disk and swap; controlled admin access</text><text x="53" y="417" class="label">RAM, caches, writable layers and snapshots matter.</text><rect x="35" y="475" width="570" height="125" rx="10" fill="#fff" stroke="#174c4f" stroke-width="2"/><text x="53" y="509" class="heading">Network · permitted connections</text><text x="53" y="540" class="label">TLS + certificate verification; ingress/egress rules</text><text x="53" y="567" class="label">Test every transfer endpoint and permitted route.</text><rect x="35" y="625" width="570" height="125" rx="10" fill="#fff" stroke="#174c4f" stroke-width="2"/><text x="53" y="659" class="heading">Storage · persistent custody</text><text x="53" y="690" class="label">ACLs, ciphertext, replicas, logs and retention</text><text x="53" y="717" class="label">Keys remain separate; backups need their own plan.</text></svg>