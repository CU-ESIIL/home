<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1050" role="img" aria-labelledby="title desc">
<title id="title">Restricted data lifecycle</title><desc id="desc">Prepare and authorize data, encrypt and store, transfer ciphertext using GoCommands, decrypt and analyze inside an approved VM, review and encrypt outputs, upload and verify results, then clean up scratch storage, keys, snapshots and sessions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#174c4f"/></marker></defs>
<rect width="640" height="1050" rx="16" fill="#f7f4eb"/>
<style>text{font-family:'Open Sans',Arial,sans-serif;fill:#153e43}.heading{font-size:24px;font-weight:700}.label{font-size:20px}.small{font-size:18px}.box{fill:#fff;stroke:#174c4f;stroke-width:2}.flow{fill:none;stroke:#174c4f;stroke-width:3;marker-end:url(#arrow)}</style>
<rect x="45" y="25" width="550" height="115" rx="10" fill="#fff" stroke="#174c4f" stroke-width="2"/><text x="63" y="59" class="heading">1 · Prepare and authorize</text><text x="63" y="90" class="label">Classify, minimize, separate linkage keys</text><path class="flow" d="M320 140L320 165"/><rect x="45" y="170" width="550" height="115" rx="10" fill="#fff" stroke="#174c4f" stroke-width="2"/><text x="63" y="204" class="heading">2 · Encrypt and preserve</text><text x="63" y="235" class="label">CyVerse collection: ciphertext + verified ACLs</text><path class="flow" d="M320 285L320 310"/><rect x="45" y="315" width="550" height="115" rx="10" fill="#fff" stroke="#174c4f" stroke-width="2"/><text x="63" y="349" class="heading">3 · Transfer with GoCommands</text><text x="63" y="380" class="label">Ciphertext over verified encrypted connections</text><path class="flow" d="M320 430L320 455"/><rect x="45" y="460" width="550" height="115" rx="10" fill="#f5e1cf" stroke="#174c4f" stroke-width="2"/><text x="63" y="494" class="heading">4–5 · Enter and analyze</text><text x="63" y="525" class="label">Approved VM: plaintext in RAM, scratch, caches</text><path class="flow" d="M320 575L320 600"/><rect x="45" y="605" width="550" height="115" rx="10" fill="#f5e1cf" stroke="#174c4f" stroke-width="2"/><text x="63" y="639" class="heading">6 · Review and encrypt outputs</text><text x="63" y="670" class="label">Treat derived results as restricted until reviewed</text><path class="flow" d="M320 720L320 745"/><rect x="45" y="750" width="550" height="115" rx="10" fill="#fff" stroke="#174c4f" stroke-width="2"/><text x="63" y="784" class="heading">6 · Upload and verify</text><text x="63" y="815" class="label">GoCommands → CyVerse; verify returned bytes</text><path class="flow" d="M320 865L320 890"/><rect x="45" y="895" width="550" height="115" rx="10" fill="#fff" stroke="#174c4f" stroke-width="2"/><text x="63" y="929" class="heading">7 · Close the plaintext boundary</text><text x="63" y="960" class="label">Remove scratch; address keys, snapshots, sessions</text></svg>