<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="title desc">
<title id="title">Secure Cloud Reproducibility Triangle</title><desc id="desc">GitHub sends sanitized code to controlled compute. CyVerse stores ciphertext. Encrypted transfers connect storage and compute; ordinary analysis exposes plaintext in the approved compute boundary. Keys travel through a separate approved channel.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#174c4f"/></marker></defs>
<rect width="640" height="600" rx="16" fill="#f7f4eb"/>
<style>text{font-family:'Open Sans',Arial,sans-serif;fill:#153e43}.heading{font-size:24px;font-weight:700}.label{font-size:20px}.small{font-size:18px}.box{fill:#fff;stroke:#174c4f;stroke-width:2}.flow{fill:none;stroke:#174c4f;stroke-width:3;marker-end:url(#arrow)}</style>
<rect x="120" y="25" width="400" height="120" rx="10" fill="#fff" stroke="#174c4f" stroke-width="2"/><text x="138" y="59" class="heading">GitHub · reproducibility</text><text x="138" y="90" class="label">Code and sanitized documentation</text><text x="138" y="117" class="label">No restricted data or secrets</text><path class="flow" d="M240 150L130 215"/><path class="flow" d="M400 150L510 215"/><rect x="20" y="235" width="290" height="155" rx="10" fill="#fff" stroke="#174c4f" stroke-width="2"/><text x="38" y="269" class="heading">CyVerse · iRODS</text><text x="38" y="300" class="label">Ciphertext objects</text><text x="38" y="327" class="label">Verified ACLs and TLS</text><text x="38" y="354" class="label">At-rest controls: confirm</text><rect x="330" y="235" width="290" height="155" rx="10" fill="#f5e1cf" stroke="#174c4f" stroke-width="2"/><text x="348" y="269" class="heading">Controlled compute</text><text x="348" y="300" class="label">Plaintext during analysis</text><text x="348" y="327" class="label">Encrypted scratch volume</text><text x="348" y="354" class="label">VM + container controls</text><path class="flow" d="M310 320L330 320"/><path class="flow" d="M330 355L310 355"/><text x="320" y="414" class="small" text-anchor="middle">GoCommands · encrypted transfers</text><rect x="70" y="425" width="500" height="140" rx="10" fill="#fff" stroke="#174c4f" stroke-width="2"/><text x="88" y="459" class="heading">Separate key custody</text><text x="88" y="490" class="label">Authorized key release → approved compute</text><text x="88" y="517" class="label">Providers can still see permitted metadata</text><text x="88" y="544" class="label">Administrator access remains in the threat model</text></svg>